    <style>
        .servers-box {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
            flex-wrap: wrap;
            align-items: center;
        }
        .server-btn {
            background: #1f1f1f;
            color: #fff;
            border: 1px solid #333;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            transition: 0.2s;
        }
        .server-btn.active {
            background: #e50914;
            border-color: #e50914;
        }
        .server-btn:hover {
            background: #333;
        }
        .series-controls {
            display: none;
            background: #141414;
            border: 1px solid #2a2a2a;
            border-radius: 10px;
            padding: 15px;
            margin-top: 15px;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }
        .control-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .control-group label {
            color: #ccc;
            font-size: 14px;
            font-weight: bold;
        }
        .series-select {
            background: #222;
            color: #fff;
            border: 1px solid #444;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            cursor: pointer;
        }
        .meta-badges {
            display: flex;
            gap: 10px;
            margin: 10px 0;
            flex-wrap: wrap;
        }
        .meta-badge {
            background: #222;
            color: #ddd;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            border: 1px solid #333;
        }
        .meta-badge.section-tag {
            background: #e50914;
            color: #fff;
            border-color: #e50914;
            font-weight: bold;
        }
        .title-fav-wrapper {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 20px;
        }
        .fav-action-btn {
            background: #222;
            color: #fff;
            border: 1px solid #444;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.2s;
        }
        .fav-action-btn.active {
            background: #e50914;
            border-color: #e50914;
            color: #fff;
        }
        .fav-action-btn:hover {
            background: #333;
        }
        .poster-wrapper {
            position: relative;
        }
        .poster-fav-btn {
            position: absolute;
            top: 8px;
            left: 8px;
            background: rgba(0, 0, 0, 0.7);
            border: none;
            color: #fff;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            transition: 0.2s;
            z-index: 5;
        }
        .poster-fav-btn.active {
            color: #e50914;
            background: rgba(229, 9, 20, 0.2);
        }
        .poster-fav-btn:hover {
            background: rgba(229, 9, 20, 0.8);
            color: #fff;
        }
    </style>

    <!-- السكربت البرمجي -->
    <script>
        let currentMovieId = '';
        let currentMovieType = 'movie';
        let currentSeason = 1;
        let currentEpisode = 1;
        let activeServerNum = 1;
        let currentMovieData = null;
        let defaultServersHtml = '';

        // التحكم في تشغيل إعلان Popunder على إجراءات المشاهدة بحد أقصى مرتين
        const WATCH_POP_MAX = 2;
        const WATCH_POP_KEY = 'youbcima_watch_pop_count';
        const MONETAG_POP_ZONE = '12344452';
        const MONETAG_POP_SRC = 'https://al5sm.com/tag.min.js';
        let monetagPopLoaded = false;

        function getWatchPopCount() {
            try {
                return parseInt(sessionStorage.getItem(WATCH_POP_KEY) || '0', 10) || 0;
            } catch (e) {
                return 0;
            }
        }

        function setWatchPopCount(count) {
            try {
                sessionStorage.setItem(WATCH_POP_KEY, String(count));
            } catch (e) {}
        }

        function triggerWatchPopunder() {
            const currentCount = getWatchPopCount();
            if (currentCount >= WATCH_POP_MAX) return;

            setWatchPopCount(currentCount + 1);

            if (!monetagPopLoaded) {
                monetagPopLoaded = true;
                const target = [document.documentElement, document.body].filter(Boolean).pop();
                if (target) {
                    const s = document.createElement('script');
                    s.dataset.zone = MONETAG_POP_ZONE;
                    s.src = MONETAG_POP_SRC;
                    s.async = true;
                    target.appendChild(s);
                }
            }
        }

        function isShortDramaEntry(movie) {
            if (!movie && currentMovieType !== 'short' && !String(currentMovieId || '').startsWith('dm_')) {
                return false;
            }
            if (currentMovieType === 'short' || String(currentMovieId || '').startsWith('dm_')) {
                return true;
            }
            if (!movie) return false;
            return (
                movie.type === 'short' ||
                movie.section === 'دراما قصيرة' ||
                movie.section === 'أفلام قصيرة' ||
                movie.source === 'dailymotion'
            );
        }

        function cleanShortDescription(text) {
            if (!text) return '';
            return text
                .replace(/<br\s*\/?>/gi, ' ')
                .replace(/&nbsp;/gi, ' ')
                .replace(/<[^>]+>/g, '')
                .replace(/\s+/g, ' ')
                .trim();
        }

        function getShortDramaEmbedUrl(movie) {
            const idStr = String((movie && movie.id) || currentMovieId || '').trim();
            if (idStr.startsWith('dm_')) {
                const rawDmId = idStr.slice(3).trim();
                if (rawDmId) {
                    if (activeServerNum === 2) {
                        return `https://geo.dailymotion.com/player.html?video=${encodeURIComponent(rawDmId)}`;
                    }
                    return `https://www.dailymotion.com/embed/video/${encodeURIComponent(rawDmId)}`;
                }
            }
            if (movie && Array.isArray(movie.streams) && movie.streams.length > 0) {
                const streamObj = movie.streams[activeServerNum - 1] || movie.streams[0];
                if (streamObj && streamObj.url && /^https?:\/\//i.test(streamObj.url)) {
                    return streamObj.url;
                }
            }
            if (movie && movie.stream_url && /^https?:\/\//i.test(movie.stream_url)) {
                return movie.stream_url;
            }
            if (movie && movie.embedUrl && /^https?:\/\//i.test(movie.embedUrl)) {
                return movie.embedUrl;
            }
            return '';
        }

        function syncServersBarForMode(movie) {
            const serversBox = document.getElementById('serversBox');
            if (!serversBox) return;

            if (!defaultServersHtml) {
                defaultServersHtml = serversBox.innerHTML;
            }

            if (isShortDramaEntry(movie)) {
                const hasSecondDm = String((movie && movie.id) || currentMovieId || '').trim().startsWith('dm_');
                serversBox.innerHTML = `
                    <span style="color: #aaa; font-size: 13px;"><i class="fa-solid fa-server"></i> <span data-i18n="servers_label">السيرفرات:</span></span>
                    <button type="button" class="server-btn ${activeServerNum === 1 ? 'active' : ''}" onclick="changeServer(1)">سيرفر 1 (Dailymotion)</button>
                    ${hasSecondDm ? `<button type="button" class="server-btn ${activeServerNum === 2 ? 'active' : ''}" onclick="changeServer(2)">سيرفر 2 (Geo)</button>` : ''}
                `;
            } else {
                serversBox.innerHTML = defaultServersHtml;
                document.querySelectorAll('.server-btn').forEach((btn, idx) => {
                    if (idx + 1 === activeServerNum) btn.classList.add('active');
                    else btn.classList.remove('active');
                });
            }
        }

        function getActiveLang() {
            if (typeof currentLang !== 'undefined' && currentLang) {
                return currentLang;
            }
            return localStorage.getItem('user_lang') || 'ar-dz';
        }

        function getFavorites() {
            return JSON.parse(localStorage.getItem('youbcima_favorites') || '[]');
        }

        function isFavorite(id) {
            return getFavorites().some(item => String(item.id) === String(id));
        }

        function toggleFavorite(movie) {
            let favs = getFavorites();
            const index = favs.findIndex(item => String(item.id) === String(movie.id));
            if (index > -1) {
                favs.splice(index, 1);
            } else {
                favs.push({
                    id: movie.id,
                    title: movie.title,
                    poster: movie.poster,
                    type: movie.type || 'movie',
                    year: movie.year || '',
                    rating: movie.rating || ''
                });
            }
            localStorage.setItem('youbcima_favorites', JSON.stringify(favs));
            updateFavButtonsUI();
        }

        function toggleFavoriteCurrent() {
            if (currentMovieData) {
                toggleFavorite(currentMovieData);
            }
        }

        function updateFavButtonsUI() {
            const btn = document.getElementById('watchFavBtn');
            const txt = document.getElementById('favBtnText');
            if (!btn || !txt || !currentMovieId) return;

            const lang = getActiveLang();
            const translations = (typeof siteTranslations !== 'undefined' && siteTranslations[lang]) ? siteTranslations[lang] : {};

            if (isFavorite(currentMovieId)) {
                btn.classList.add('active');
                txt.textContent = translations.remove_fav || (lang === 'fr' ? 'Retirer des favoris' : lang === 'en' ? 'Remove from Favorites' : 'إزالة من المفضلة');
            } else {
                btn.classList.remove('active');
                txt.textContent = translations.add_fav || (lang === 'fr' ? 'Ajouter aux favoris' : lang === 'en' ? 'Add to Favorites' : 'أضف للمفضلة');
            }
        }

        function saveToHistory() {
            if (!currentMovieData) return;
            let history = JSON.parse(localStorage.getItem('youbcima_history') || '[]');
            history = history.filter(item => String(item.id) !== String(currentMovieId));

            history.unshift({
                id: currentMovieId,
                title: currentMovieData.title,
                poster: currentMovieData.poster,
                type: currentMovieType,
                season: currentSeason,
                episode: currentEpisode,
                timestamp: Date.now()
            });

            if (history.length > 10) history.pop();
            localStorage.setItem('youbcima_history', JSON.stringify(history));
        }

        function updatePlayer() {
            const iframe = document.getElementById('videoIframe');
            if (!iframe || !currentMovieId) return;

            syncServersBarForMode(currentMovieData);

            // إصلاح خاص بالدراما القصيرة فقط؛ بقية الأعمال تبقى كما هي تماماً
            if (isShortDramaEntry(currentMovieData)) {
                const shortUrl = getShortDramaEmbedUrl(currentMovieData);
                if (shortUrl) {
                    iframe.src = shortUrl;
                    saveToHistory();
                    return;
                }
            }

            if (activeServerNum === 1) {
                iframe.src = currentMovieType === 'tv'
                    ? `https://vidlink.pro/tv/${currentMovieId}/${currentSeason}/${currentEpisode}`
                    : `https://vidlink.pro/movie/${currentMovieId}`;
            } else if (activeServerNum === 2) {
                iframe.src = currentMovieType === 'tv'
                    ? `https://vidsrc.me/embed/tv?tmdb=${currentMovieId}&season=${currentSeason}&episode=${currentEpisode}`
                    : `https://vidsrc.me/embed/movie?tmdb=${currentMovieId}`;
            } else if (activeServerNum === 3) {
                iframe.src = currentMovieType === 'tv'
                    ? `https://embed.su/embed/tv/${currentMovieId}/${currentSeason}/${currentEpisode}`
                    : `https://embed.su/embed/movie/${currentMovieId}`;
            } else if (activeServerNum === 4) {
                iframe.src = currentMovieType === 'tv'
                    ? `https://player.autoembed.cc/embed/tv/${currentMovieId}/${currentSeason}/${currentEpisode}`
                    : `https://player.autoembed.cc/embed/movie/${currentMovieId}`;
            } else if (activeServerNum === 5) {
                iframe.src = currentMovieType === 'tv'
                    ? `https://2embed.cc/embedtv/${currentMovieId}&s=${currentSeason}&e=${currentEpisode}`
                    : `https://2embed.cc/embed/${currentMovieId}`;
            } else if (activeServerNum === 6) {
                iframe.src = currentMovieType === 'tv'
                    ? `https://multiembed.mov/?video_id=${currentMovieId}&tmdb=1&s=${currentSeason}&e=${currentEpisode}`
                    : `https://multiembed.mov/?video_id=${currentMovieId}&tmdb=1`;
            }

            saveToHistory();
        }

        function changeServer(num) {
            triggerWatchPopunder();
            activeServerNum = num;
            document.querySelectorAll('.server-btn').forEach((btn, idx) => {
                if (idx + 1 === num) btn.classList.add('active');
                else btn.classList.remove('active');
            });
            updatePlayer();
        }

        function populateSeasonEpisodeSelects() {
            const seasonSelect = document.getElementById('seasonSelect');
            const episodeSelect = document.getElementById('episodeSelect');
            if (!seasonSelect || !episodeSelect) return;

            const lang = getActiveLang();
            const currentS = seasonSelect.value || currentSeason;
            const currentE = episodeSelect.value || currentEpisode;

            seasonSelect.innerHTML = '';
            episodeSelect.innerHTML = '';

            for (let s = 1; s <= 10; s++) {
                const opt = document.createElement('option');
                opt.value = s;
                opt.textContent = (lang === 'fr' ? 'Saison ' : lang === 'en' ? 'Season ' : 'الموسم ') + s;
                if (String(s) === String(currentS)) opt.selected = true;
                seasonSelect.appendChild(opt);
            }

            for (let e = 1; e <= 50; e++) {
                const opt = document.createElement('option');
                opt.value = e;
                opt.textContent = (lang === 'fr' ? 'Épisode ' : lang === 'en' ? 'Episode ' : 'الحلقة ') + e;
                if (String(e) === String(currentE)) opt.selected = true;
                episodeSelect.appendChild(opt);
            }
        }

        function switchLanguage(lang) {
            if (typeof applyLanguage === 'function') {
                applyLanguage(lang);
            }
            updateFavButtonsUI();
            populateSeasonEpisodeSelects();
        }

        function updateJsonLdSchema(movie) {
            const safeTitle = movie.title || 'مشاهدة العرض';
            const cleanDesc = cleanShortDescription(movie.overview || '') || `مشاهدة ${safeTitle} بجودة عالية على Youb Cima.`;
            const isShort = isShortDramaEntry(movie);
            const schemaType = isShort ? 'VideoObject' : (currentMovieType === 'tv' ? 'TVSeries' : 'Movie');

            const canonicalUrl = `${window.location.origin}/watch.html?id=${encodeURIComponent(movie.id || currentMovieId)}&type=${encodeURIComponent(isShort ? 'short' : currentMovieType)}`;

            let canonicalLink = document.querySelector('link[rel="canonical"]');
            if (!canonicalLink) {
                canonicalLink = document.createElement('link');
                canonicalLink.setAttribute('rel', 'canonical');
                document.head.appendChild(canonicalLink);
            }
            canonicalLink.setAttribute('href', canonicalUrl);

            const schemaData = {
                "@context": "https://schema.org",
                "@type": schemaType,
                "name": safeTitle,
                "description": cleanDesc,
                "url": canonicalUrl
            };

            if (movie.poster && /^https?:\/\//i.test(movie.poster)) {
                schemaData.image = movie.poster;
                if (isShort) {
                    schemaData.thumbnailUrl = [movie.poster];
                }
            }

            if (movie.year) {
                schemaData.datePublished = String(movie.year);
            }

            const ratingNum = parseFloat(movie.rating);
            if (!Number.isNaN(ratingNum) && ratingNum > 0) {
                schemaData.aggregateRating = {
                    "@type": "AggregateRating",
                    "ratingValue": Math.min(ratingNum, 10),
                    "bestRating": 10,
                    "ratingCount": 1
                };
            }

            const shortEmbed = isShort ? getShortDramaEmbedUrl(movie) : '';
            if (shortEmbed) {
                schemaData.embedUrl = shortEmbed;
            }

            let schemaScript = document.getElementById('jsonLdSchema');
            if (!schemaScript) {
                schemaScript = document.createElement('script');
                schemaScript.id = 'jsonLdSchema';
                schemaScript.type = 'application/ld+json';
                document.head.appendChild(schemaScript);
            }
            schemaScript.textContent = JSON.stringify(schemaData);
        }

        function updatePageSeoMeta(movie) {
            const safeTitle = movie.title || 'مشاهدة العرض';
            const yearText = movie.year ? ` (${movie.year})` : '';
            const pageTitle = `مشاهدة ${safeTitle}${yearText} - Youb Cima`;
            document.title = pageTitle;

            const metaDesc = document.getElementById('metaDesc');
            if (metaDesc) {
                const rawOverview = isShortDramaEntry(movie)
                    ? cleanShortDescription(movie.overview || '')
                    : (movie.overview || '');
                const combined = rawOverview ? `${pageTitle} - ${rawOverview}` : pageTitle;
                metaDesc.setAttribute('content', combined.slice(0, 160));
            }

            updateJsonLdSchema(movie);
        }

        function initWatchPage() {
            let savedLang = localStorage.getItem('user_lang');
            if (!savedLang) {
                const phoneLang = navigator.language || navigator.userLanguage || 'ar';
                if (phoneLang.startsWith('ar')) savedLang = 'ar-dz';
                else if (phoneLang.startsWith('fr')) savedLang = 'fr';
                else if (phoneLang.startsWith('es')) savedLang = 'es';
                else savedLang = 'en';
            }
            if (typeof applyLanguage === 'function') {
                applyLanguage(savedLang);
            }

            const urlParams = new URLSearchParams(window.location.search);
            currentMovieId = urlParams.get('id');
            currentMovieType = urlParams.get('type') || 'movie';
            const savedSeason = urlParams.get('s');
            const savedEpisode = urlParams.get('e');

            if (savedSeason) currentSeason = savedSeason;
            if (savedEpisode) currentEpisode = savedEpisode;

            if (currentMovieId) {
                const seriesControls = document.getElementById('seriesControls');
                const seasonSelect = document.getElementById('seasonSelect');
                const episodeSelect = document.getElementById('episodeSelect');

                if (currentMovieType === 'tv') {
                    if (seriesControls) seriesControls.style.display = 'flex';
                    populateSeasonEpisodeSelects();

                    if (seasonSelect) {
                        seasonSelect.onchange = (e) => {
                            triggerWatchPopunder();
                            currentSeason = e.target.value;
                            updatePlayer();
                        };
                    }
                    if (episodeSelect) {
                        episodeSelect.onchange = (e) => {
                            triggerWatchPopunder();
                            currentEpisode = e.target.value;
                            updatePlayer();
                        };
                    }
                } else if (seriesControls) {
                    seriesControls.style.display = 'none';
                }

                syncServersBarForMode(null);

                fetch('movies.json', { cache: 'no-store' })
                    .then(response => response.json())
                    .then(movies => {
                        const movie = movies.find(m => String(m.id) === String(currentMovieId));
                        if (movie) {
                            currentMovieData = movie;
                            if (isShortDramaEntry(movie)) {
                                currentMovieType = 'short';
                                if (seriesControls) seriesControls.style.display = 'none';
                            }
                            syncServersBarForMode(movie);
                            updatePageSeoMeta(movie);

                            const lang = getActiveLang();
                            const translations = (typeof siteTranslations !== 'undefined' && siteTranslations[lang]) ? siteTranslations[lang] : {};

                            const titleEl = document.getElementById('movieTitle');
                            const descEl = document.getElementById('movieDesc');
                            if (titleEl) titleEl.textContent = movie.title || "بدون عنوان";
                            if (descEl) {
                                const descText = isShortDramaEntry(movie)
                                    ? cleanShortDescription(movie.overview)
                                    : movie.overview;
                                descEl.textContent = descText || translations.no_overview || "لا يوجد وصف متوفر.";
                            }

                            const badgesContainer = document.getElementById('metaBadges');
                            if (badgesContainer) {
                                let badgesHTML = '';
                                if (movie.section) badgesHTML += `<span class="meta-badge section-tag">${movie.section}</span>`;
                                if (movie.year) badgesHTML += `<span class="meta-badge"><i class="fa-regular fa-calendar"></i> ${movie.year}</span>`;
                                if (movie.rating) badgesHTML += `<span class="meta-badge"><i class="fa-solid fa-star" style="color:#f5c518;"></i> ${movie.rating}</span>`;
                                badgesContainer.innerHTML = badgesHTML;
                            }
                            updateFavButtonsUI();
                        }

                        updatePlayer();

                        const relatedContainer = document.getElementById('relatedContainer');
                        if (relatedContainer) {
                            relatedContainer.innerHTML = '';
                            const lang = getActiveLang();

                            movies.filter(m => String(m.id) !== String(currentMovieId)).forEach(m => {
                                const card = document.createElement('div');
                                card.className = 'movie-card';
                                const badgeText = (m.type === 'tv')
                                    ? (lang === 'fr' ? 'Série' : lang === 'en' ? 'Series' : 'مسلسل')
                                    : 'HD';
                                const favActive = isFavorite(m.id) ? 'active' : '';
                                const safeMovieJson = JSON.stringify(m)
                                    .replace(/&/g, '&amp;')
                                    .replace(/"/g, '&quot;')
                                    .replace(/'/g, '&#39;');

                                card.innerHTML = `
                                    <div class="poster-wrapper">
                                        <button type="button" class="poster-fav-btn ${favActive}" onclick="event.stopPropagation(); toggleFavQuick(this, ${safeMovieJson})">
                                            <i class="fa-solid fa-heart"></i>
                                        </button>
                                        <img src="${m.poster}" alt="${m.title}">
                                        <span class="badge-hd">${badgeText}</span>
                                    </div>
                                    <div class="movie-title">${m.title}</div>
                                `;
                                card.onclick = () => {
                                    window.location.href = `watch.html?id=${m.id}&type=${m.type || 'movie'}`;
                                };
                                relatedContainer.appendChild(card);
                            });
                        }
                    })
                    .catch(error => console.error("خطأ في تحميل تفاصيل الفيلم:", error));
            }
        }

        if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", initWatchPage);
        } else {
            initWatchPage();
        }

        function toggleFavQuick(btn, movie) {
            toggleFavorite(movie);
            btn.classList.toggle('active', isFavorite(movie.id));
        }
    </script>
    <script src="app.js"></script>
</body>
</html>
