<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Youb Cima - متعة المشاهدة</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- الهيدر العلوي بنمط ناتفليكس -->
    <header class="top-navbar">
        <div class="nav-right">
            <a href="index.html" class="logo-container">
                <span class="logo-text">Youb<span>Cima</span></span>
                <i class="fa-solid fa-film logo-icon"></i>
            </a>
            <nav class="desktop-menu">
                <a href="index.html" class="active" data-i18n="home">الرئيسية</a>
            </nav>
        </div>

        <!-- زر الكرة الأرضية المصغر والأنيق لاختيار اللغة -->
        <div class="nav-left">
            <div class="language-switcher-header" title="تغيير اللغة">
                <span class="globe-icon">🌐</span>
                <select id="langSelect" onchange="switchLanguage(this.value)">
                    <option value="ar-dz">العربية (الجزائر)</option>
                    <option value="en">English</option>
                    <option value="fr">Français</option>
                    <option value="es">Español</option>
                </select>
            </div>

            <div class="search-container">
                <i class="fa-solid fa-magnifying-glass search-icon"></i>
                <input type="text" id="searchInput" data-i18n-placeholder="search_placeholder" placeholder="ابحث عن فيلم أو مسلسل...">
            </div>
        </div>
    </header>

    <!-- قسم الهيرو البارز (Featured Showcase) -->
    <section class="hero-section" id="heroSection">
        <div class="hero-overlay"></div>
        <div class="hero-content">
            <span class="hero-badge" data-i18n="trending_badge"><i class="fa-solid fa-fire"></i> الأكثر مشاهدة اليوم</span>
            <h1 class="hero-title" id="heroTitle">جاري التحميل...</h1>
            <p class="hero-description" id="heroDesc" data-i18n="hero_desc">
                استمتع بأحدث الأفلام والمسلسلات بجودة عالية حصرياً على Youb Cima.
            </p>
            <div class="hero-buttons">
                <button class="btn btn-play" id="heroPlayBtn">
                    <i class="fa-solid fa-play"></i> <span data-i18n="watch_now">تشغيل الآن</span>
                </button>
            </div>
        </div>
    </section>

    <!-- السطر الأول: الأقسام الأساسية (الكل، أفلام، مسلسلات، أنمي) -->
    <div class="categories-bar" id="categoriesBar">
        <button class="cat-btn active" data-section="all" data-i18n="cat_all">الكل</button>
        <button class="cat-btn" data-section="movies" data-i18n="cat_movies">أفلام</button>
        <button class="cat-btn" data-section="tv" data-i18n="cat_series">مسلسلات</button>
        <button class="cat-btn" data-section="أنمي" data-i18n="cat_anime">أنمي</button>
    </div>

    <!-- السطر الثاني: تصنيفات المسلسلات حسب الدولة/اللغة -->
    <div class="series-sub-bar" id="seriesSubBar" style="display: none;">
        <button class="series-sub-btn active" data-series-type="all" data-i18n="cat_all">الكل</button>
        <button class="series-sub-btn" data-series-type="مسلسلات عربية" data-i18n="series_arabic">مسلسلات عربية</button>
        <button class="series-sub-btn" data-series-type="مسلسلات تركية" data-i18n="series_turkish">مسلسلات تركية</button>
        <button class="series-sub-btn" data-series-type="مسلسلات كورية" data-i18n="series_korean">مسلسلات كورية</button>
        <button class="series-sub-btn" data-series-type="مسلسلات أجنبية" data-i18n="series_foreign">مسلسلات أجنبية</button>
    </div>

    <!-- السطر الثالث: زر الأحدث + تصنيفات IMDb الفرعية + القائمة المنسدلة للسنة -->
    <div class="sub-categories-bar" id="subCategoriesBar" style="display: none;">
        <div class="genres-scroll">
            <button class="sub-cat-btn active" data-genre="all" data-i18n="cat_all">الكل</button>
            <button class="sub-cat-btn" data-genre="latest"><i class="fa-solid fa-bolt"></i> <span data-i18n="genre_latest">الأحدث</span></button>
            <button class="sub-cat-btn" data-genre="أكشن" data-i18n="genre_action">أكشن</button>
            <button class="sub-cat-btn" data-genre="رعب" data-i18n="genre_horror">رعب</button>
            <button class="sub-cat-btn" data-genre="دراما" data-i18n="genre_drama">دراما</button>
            <button class="sub-cat-btn" data-genre="كوميديا" data-i18n="genre_comedy">كوميديا</button>
            <button class="sub-cat-btn" data-genre="خيال علمي" data-i18n="genre_scifi">خيال علمي</button>
            <button class="sub-cat-btn" data-genre="إثارة" data-i18n="genre_thriller">إثارة</button>
            <button class="sub-cat-btn" data-genre="مغامرة" data-i18n="genre_adventure">مغامرة</button>
        </div>

        <!-- قائمة منسدلة لسنة الإنتاج -->
        <div class="dropdown-filter-container" id="yearDropdownContainer" style="display: none;">
            <select id="yearSelect" class="netflix-dropdown">
                <option value="all" data-i18n="year_all">سنة الإنتاج: الكل</option>
                <option value="2026">2026</option>
                <option value="2025">2025</option>
                <option value="2024">2024</option>
                <option value="2023">2023</option>
                <option value="2022" data-i18n="year_older">2022 فما قبل</option>
            </select>
        </div>
    </div>

    <!-- صفوف الأفلام والمسلسلات الأفقية -->
    <main class="content-container">
        
        <section class="row-section">
            <h2 class="row-title"><i class="fa-solid fa-fire"></i> <span data-i18n="row_trending">الأكثر شهرة والأحدث</span></h2>
            <div class="row-cards" id="trendingRow"></div>
        </section>

        <section class="row-section">
            <h2 class="row-title"><i class="fa-solid fa-tv"></i> <span data-i18n="row_series">مسلسلات</span></h2>
            <div class="row-cards" id="turkishSeriesRow"></div>
        </section>

        <section class="row-section">
            <h2 class="row-title"><i class="fa-solid fa-clapperboard"></i> <span data-i18n="row_movies">أفلام</span></h2>
            <div class="row-cards" id="arabicMoviesRow"></div>
        </section>

        <section class="row-section">
            <h2 class="row-title"><i class="fa-solid fa-dragon"></i> <span data-i18n="row_anime">أنمي وكرتون</span></h2>
            <div class="row-cards" id="animeRow"></div>
        </section>

    </main>

    <!-- شريط التنقل السفلي للهواتف -->
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item active">
            <i class="fa-solid fa-house"></i>
            <span data-i18n="home">الرئيسية</span>
        </a>
        <a href="#" class="nav-item" onclick="document.getElementById('searchInput')?.focus(); return false;">
            <i class="fa-solid fa-magnifying-glass"></i>
            <span data-i18n="search_bottom">بحث</span>
        </a>
        <a href="#" class="nav-item">
            <i class="fa-brands fa-telegram"></i>
            <span>Telegram</span>
        </a>
        <a href="index.html?view=favorites" class="nav-item" id="favBottomNav">
            <i class="fa-solid fa-heart" style="color: #e50914;"></i>
            <span data-i18n="favorites">المفضلة</span>
        </a>
    </nav>

    <script src="app.js"></script>
</body>
</html>
