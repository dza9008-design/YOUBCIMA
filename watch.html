<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشاهدة العمل - Youb Cima</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #141414; color: #fff; font-family: 'Cairo', sans-serif; margin: 0; padding: 0; }
        .watch-container { max-width: 1000px; margin: 20px auto; padding: 15px; }
        .player-wrapper { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 12px; overflow: hidden; margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.7); }
        .player-wrapper iframe { width: 100%; height: 100%; border: none; }
        .movie-info-section { background: #1f1f1f; padding: 20px; border-radius: 12px; margin-bottom: 20px; }
        .movie-title-main { font-size: 24px; font-weight: bold; margin-bottom: 10px; color: #fff; }
        .movie-meta { display: flex; gap: 15px; color: #aaa; font-size: 14px; margin-bottom: 15px; align-items: center; }
        .badge-tag { background: #e50914; color: #fff; padding: 3px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .movie-desc { color: #ccc; font-size: 15px; line-height: 1.6; margin-bottom: 20px; }
        .actions-bar { display: flex; gap: 15px; align-items: center; }
        .btn-action { background: #333; color: #fff; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: 0.2s; font-size: 14px; }
        .btn-action:hover { background: #444; }
        .btn-action.active { background: #e50914; }
        .back-btn { display: inline-flex; align-items: center; gap: 8px; color: #fff; text-decoration: none; margin: 20px; font-size: 16px; background: rgba(255,255,255,0.1); padding: 8px 16px; border-radius: 8px; transition: 0.2s; }
        .back-btn:hover { background: rgba(255,255,255,0.2); }
    </style>
</head>
<body>

    <a href="index.html" class="back-btn">
        <i class="fa-solid fa-arrow-right"></i> العودة للرئيسية
    </a>

    <div class="watch-container">
        <!-- مشغل الفيديو / الـ Iframe -->
        <div class="player-wrapper" id="playerWrapper">
            <iframe id="videoIframe" src="" allowfullscreen></iframe>
        </div>

        <!-- معلومات الفيلم أو المسلسل -->
        <div class="movie-info-section">
            <h1 class="movie-title-main" id="watchTitle">جاري تحميل البيانات...</h1>
            <div class="movie-meta">
                <span class="badge-tag" id="watchBadge">HD</span>
                <span id="watchYear"><i class="fa-solid fa-calendar"></i> ----</span>
                <span id="watchRating"><i class="fa-solid fa-star" style="color: gold;"></i> --</span>
            </div>
            <p class="movie-desc" id="watchDesc">يرجى الانتظار ريثما يتم جلب تفاصيل العمل...</p>
            
            <div class="actions-bar">
                <button class="btn-action" id="favWatchBtn" onclick="toggleFavCurrentMovie()">
                    <i class="fa-solid fa-heart"></i> أضف للمفضلة
                </button>
            </div>
        </div>
    </div>

    <script>
        let currentMovieData = null;

        async function loadWatchPage() {
            const urlParams = new URLSearchParams(window.location.search);
            const movieId = urlParams.get('id');
            const movieType = urlParams.get('type') || 'movie';

            if (!movieId) {
                document.getElementById('watchTitle').textContent = "عذراً، لم يتم تحديد الفيلم أو المسلسل!";
                return;
            }

            try {
                const response = await fetch('movies.json');
                const movies = await response.json();
                
                // البحث عن العمل المطابق للـ ID
                const movie = movies.find(m => String(m.id) === String(movieId));

                if (!movie) {
                    document.getElementById('watchTitle').textContent = "عذراً، لم يتم العثور على هذا العمل!";
                    return;
                }

                currentMovieData = movie;

                // تعبئة البيانات في الواجهة
                document.getElementById('watchTitle').textContent = movie.title;
                document.getElementById('watchDesc').textContent = movie.overview || "لا توجد قصة متاحة لهذا العمل حالياً.";
                document.getElementById('watchYear').innerHTML = `<i class="fa-solid fa-calendar"></i> ${movie.year || '2024'}`;
                document.getElementById('watchRating').innerHTML = `<i class="fa-solid fa-star" style="color: gold;"></i> ${movie.rating || '8.5'}`;
                
                const badgeEl = document.getElementById('watchBadge');
                badgeEl.textContent = movieType === 'tv' ? 'مسلسل' : 'HD';

                // تعبئة رابط المشغل (iframe)
                const iframe = document.getElementById('videoIframe');
                if (movie.videoUrl) {
                    iframe.src = movie.videoUrl;
                } else if (movieType === 'tv') {
                    // رابط افتراضي للمسلسلات أو الدمج عبر VidLink/Embed
                    iframe.src = `https://vidlink.pro/tv/${movie.id}/1/1`;
                } else {
                    // رابط افتراضي للأفلام
                    iframe.src = `https://vidlink.pro/movie/${movie.id}`;
                }

                // تحديث زر المفضلة
                updateFavButtonState();

                // حفظ في سجل "أكمل المشاهدة"
                saveToHistory(movie, movieType);

            } catch (error) {
                console.error('خطأ في تحميل تفاصيل العمل:', error);
                document.getElementById('watchTitle').textContent = "حدث خطأ أثناء تحميل البيانات.";
            }
        }

        function getFavorites() {
            return JSON.parse(localStorage.getItem('youbcima_favorites') || '[]');
        }

        function isFavorite(id) {
            return getFavorites().some(item => String(item.id) === String(id));
        }

        function updateFavButtonState() {
            if (!currentMovieData) return;
            const btn = document.getElementById('favWatchBtn');
            const active = isFavorite(currentMovieData.id);
            if (active) {
                btn.classList.add('active');
                btn.innerHTML = `<i class="fa-solid fa-heart"></i> إزالة من المفضلة`;
            } else {
                btn.classList.remove('active');
                btn.innerHTML = `<i class="fa-solid fa-heart"></i> أضف للمفضلة`;
            }
        }

        function toggleFavCurrentMovie() {
            if (!currentMovieData) return;
            let favs = getFavorites();
            const index = favs.findIndex(item => String(item.id) === String(currentMovieData.id));
            if (index > -1) {
                favs.splice(index, 1);
            } else {
                favs.push({
                    id: currentMovieData.id,
                    title: currentMovieData.title,
                    poster: currentMovieData.poster,
                    type: currentMovieData.type || 'movie',
                    year: currentMovieData.year || '',
                    rating: currentMovieData.rating || ''
                });
            }
            localStorage.setItem('youbcima_favorites', JSON.stringify(favs));
            updateFavButtonState();
        }

        function saveToHistory(movie, type) {
            let history = JSON.parse(localStorage.getItem('youbcima_history') || '[]');
            // إزالة العمل إذا كان موجوداً مسبقاً لإضافته في المقدمة
            history = history.filter(item => String(item.id) !== String(movie.id));
            history.unshift({
                id: movie.id,
                title: movie.title,
                poster: movie.poster,
                type: type,
                season: 1,
                episode: 1
            });
            if (history.length > 10) history.pop(); // الاحتفاظ بآخر 10 أعمال فقط
            localStorage.setItem('youbcima_history', JSON.stringify(history));
        }

        document.addEventListener('DOMContentLoaded', loadWatchPage);
    </script>
</body>
</html>
