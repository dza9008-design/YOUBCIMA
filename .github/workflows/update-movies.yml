name: Run Movie Bot Automatically

on:
  schedule:
    - cron: '0 */2 * * *' # يعمل تلقائياً كل ساعتين
  workflow_dispatch: # يتيح لك تشغيله يدوياً في أي وقت من زر Run workflow

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write # منح الصلاحية للبوت لتحديث ملف movies.json ورفعه
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install requests beautifulsoup4; fi

      - name: Run Python Bot
        run: python bot.py

      - name: Commit and push updated movies
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add movies.json
          git diff --staged --quiet || (git commit -m "🤖 Auto-update movies database via bot [skip ci]" && git push)
